appId: com.greentunnel.desktop
productName: GreenTunnel
copyright: Copyright © Sadegh Hayeri

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# Tray icons are loaded by path at runtime (so macOS can pick up the @2x
# variants), which means they must stay real files outside the asar. `icon.png`
# is here for the same reason: Linux and Windows windows carry their own icon,
# and the dev dock has no bundle to take one from.
extraResources:
  - from: resources
    to: resources

# Every icon below — and resources/icon.png — is generated from the one source
# of truth, assets/logo.png (2000×2000, the same artwork v2 shipped):
#
#   for s in 16 32 128 256 512; do
#     sips -z $s $s assets/logo.png --out icon.iconset/icon_${s}x${s}.png
#     sips -z $((s*2)) $((s*2)) assets/logo.png --out icon.iconset/icon_${s}x${s}@2x.png
#   done
#   iconutil -c icns icon.iconset -o build/icon.icns
#   sips -z 1024 1024 assets/logo.png --out build/icon.png
#   sips -z 512  512  assets/logo.png --out resources/icon.png
#
# icon.ico holds 16/24/32/48/64/128/256 as 32bpp BMP entries.

asar: true

# There is no publish target, and saying so explicitly is load bearing. Left
# unset, electron-builder *infers* one from the environment: any `GH_TOKEN` in
# scope makes it assume a GitHub release, and it then tries to work out which
# repository from `<projectDir>/.git/config` — where projectDir is `apps/desktop`,
# which is not a git root and carries no `repository` field either. Resolution
# fails, and because `errorIfCannot` is false it returns *null* rather than
# throwing, landing a `[null]` in the publish-config list. The length-0 guard
# does not catch a list of one, so every artifact then dies in
# `computeChannelNames` on `null.channel` — four times on macOS, once per
# dmg/zip × arch — under the heading "Cannot cleanup", after the app has already
# been packaged. Nothing in that message names publishing, tokens or the
# repository.
#
# `null` short-circuits all of it: no auto-update metadata (latest-*.yml), no
# `app-update.yml` inside the bundle, and the same output on CI as on a laptop.
# The GitHub release is created by publish.yml's own job from the uploaded
# artifacts, not by electron-builder. Give this a real provider block if and
# when auto-update ships — see the roadmap.
publish: null

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # The app only sets the user's own proxy settings; no entitlements needed.
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Network
  maintainer: Sadegh Hayeri
  target:
    - AppImage
    - deb
