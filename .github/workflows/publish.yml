---
name: Publish

# v2 used `on: create` with a `tags:` filter, which the create event does not
# support — it fired for every branch too. A tag push is the real trigger.
on:
  push:
    tags:
      - v*

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./packages/cli/package.json').version")
          echo "tag=$TAG green-tunnel=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match packages/cli ($PKG)"
            exit 1
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

  publish-npm:
    name: Publish to npm
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only credential. Trusted publishing exchanges this OIDC token with
      # npm, so there is no NPM_TOKEN to leak or rotate, and provenance is signed
      # automatically — `--provenance` is not needed and neither is a secret.
      id-token: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - run: npx tsc --build packages/cli/tsconfig.build.json

      # One package. The engine is bundled in as `dist/core`, so there is no
      # second publish to order this one against.
      - name: Publish green-tunnel
        run: npm publish --workspace packages/cli

  publish-docker-hub:
    name: Publish to Docker Hub
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # One multi-arch manifest instead of v2's separate `arm-*` tags built from
      # a sed-patched Dockerfile: `docker run sadeghhayeri/green-tunnel` now
      # picks the right architecture by itself. 32-bit ARM (Pi 2/3 on a 32-bit
      # OS) is gone — `node:24-alpine` has no armv7 variant to build on.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sadeghhayeri/green-tunnel:${{ needs.verify.outputs.version }}
            sadeghhayeri/green-tunnel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-desktop:
    name: Build desktop (${{ matrix.os }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: builds-mac
            glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-latest
            script: package:win
            artifact: builds-windows
            glob: apps/desktop/release/*.exe
          - os: ubuntu-latest
            script: package:linux
            artifact: builds-linux
            glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # electron-vite bundles the engine into out/main, resolving `green-tunnel`
      # through the workspace symlink and its `main` field — so dist/ has to
      # exist *before* packaging. A fresh checkout has none, which is why this job
      # works on a dev machine (where dist/ is left over from an earlier build)
      # and failed in CI with "Failed to resolve entry for package".
      - name: Build the engine
        run: npm run build --workspace packages/cli

      - name: Package
        run: npm run ${{ matrix.script }} --workspace apps/desktop -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID certificate in CI — without this, electron-builder
          # finds an unusable identity and fails instead of shipping unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  new-release:
    name: Create GitHub release
    needs: [publish-npm, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          merge-multiple: true
          path: builds/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: builds/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
