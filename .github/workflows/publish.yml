---
name: Publish

# v2 used `on: create` with a `tags:` filter, which the create event does not
# support — it fired for every branch too. A tag push is the real trigger.
on:
  push:
    tags:
      - v*

jobs:
  # The tag is the only source of truth for the version. Nothing in the repository
  # records a release number — every manifest sits at 0.0.0 on `main` and each job
  # below stamps the tag in before it builds. So cutting a release is `git tag vX`
  # and `git push`, with no version commit to forget and nothing to keep in step.
  version:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Reject anything npm would not accept *before* any job spends time on
          # it — a typo like `v3.0` would otherwise fail late, inside `npm publish`.
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag v$TAG is not a semver version — expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Releasing $TAG"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish to npm
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only credential. Trusted publishing exchanges this OIDC token with
      # npm, so there is no NPM_TOKEN to leak or rotate, and provenance is signed
      # automatically — `--provenance` is not needed and neither is a secret.
      id-token: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      # `npm pkg set`, not `npm version`: it edits the manifests and stops there.
      # `npm version` also reconciles the lockfile, which reaches for the registry
      # and fails on a version that is not published yet. Stamped after `npm ci`
      # so the install still matches the committed lockfile.
      - name: Stamp the version from the tag
        run: npm pkg set version="$VERSION" --workspaces --include-workspace-root

      # Belt and braces: if stamping ever silently no-ops, this stops `0.0.0` from
      # reaching the registry, where the mistake could not be taken back.
      - name: Refuse to publish an unstamped version
        run: |
          HAVE=$(node -p "require('./packages/cli/package.json').version")
          [ "$HAVE" = "$VERSION" ] || { echo "::error::manifest is $HAVE, tag is $VERSION"; exit 1; }

      - run: npx tsc --build packages/cli/tsconfig.build.json

      # One package. The engine is bundled in as `dist/core`, so there is no
      # second publish to order this one against. `gt --version` reads the manifest
      # at runtime, so the stamp above is what it will report.
      - name: Publish green-tunnel
        run: npm publish --workspace packages/cli

  publish-docker-hub:
    name: Publish to Docker Hub
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # One multi-arch manifest instead of v2's separate `arm-*` tags built from
      # a sed-patched Dockerfile: `docker run sadeghhayeri/green-tunnel` now
      # picks the right architecture by itself. 32-bit ARM (Pi 2/3 on a 32-bit
      # OS) is gone — `node:24-alpine` has no armv7 variant to build on.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # VERSION is what `gt --version` reports inside the container: the
          # Dockerfile stamps it into the manifest, since nothing in the repo
          # carries a release number.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            sadeghhayeri/green-tunnel:${{ needs.version.outputs.version }}
            sadeghhayeri/green-tunnel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-desktop:
    name: Build desktop (${{ matrix.os }})
    needs: [version]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: builds-mac
            glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-latest
            script: package:win
            artifact: builds-windows
            glob: apps/desktop/release/*.exe
          - os: ubuntu-latest
            script: package:linux
            artifact: builds-linux
            glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # electron-builder names every installer from apps/desktop's version, so
      # without this the artifacts would all be called GreenTunnel-0.0.0. Same
      # `npm pkg set` as the npm job, and it must run before packaging.
      #
      # `shell: bash` is required, not cosmetic: this job also runs on Windows,
      # where the default shell is PowerShell and `$VERSION` is a PowerShell
      # variable rather than the environment — it would expand to nothing and
      # stamp an empty version, with no error.
      - name: Stamp the version from the tag
        shell: bash
        run: npm pkg set version="$VERSION" --workspaces --include-workspace-root

      # electron-vite bundles the engine into out/main, resolving `green-tunnel`
      # through the workspace symlink and its `main` field — so dist/ has to
      # exist *before* packaging. A fresh checkout has none, which is why this job
      # works on a dev machine (where dist/ is left over from an earlier build)
      # and failed in CI with "Failed to resolve entry for package".
      - name: Build the engine
        run: npm run build --workspace packages/cli

      # No GH_TOKEN here, deliberately. `--publish never` means nothing uploads,
      # so the token had no job to do — but electron-builder reads it as "publish
      # to GitHub" and starts resolving a release target it cannot find from
      # apps/desktop, which is what crashed this step on the first attempt. See
      # the comment on `publish:` in electron-builder.yml. The release itself is
      # made by the new-release job below, from the artifacts.
      - name: Package
        run: npm run ${{ matrix.script }} --workspace apps/desktop -- --publish never
        env:
          # No Developer ID certificate in CI — without this, electron-builder
          # finds an unusable identity and fails instead of shipping unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  new-release:
    name: Create GitHub release
    needs: [publish-npm, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          merge-multiple: true
          path: builds/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: builds/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
