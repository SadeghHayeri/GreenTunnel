---
name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    env:
      # Typechecking and bundling need Electron's *typings*, not its 150 MB
      # binary. Packaging jobs deliberately do not set this.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build

  hadolint:
    name: Test dockerfile syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          # DL3025: the CMD is intentionally shell form — it expands
          # `${VAR:+--flag}` to turn optional flags on and off.
          ignore: DL3025

  docker:
    name: Build and test docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find an open port
        run: echo "CLIENT_PORT=$(shuf -i 10000-19999 -n 1)" >> $GITHUB_ENV

      - name: Build docker image
        run: docker build --no-cache --tag sadeghhayeri/green-tunnel:${GITHUB_RUN_ID} .

      - name: Run container
        run: |
          DOCKERCONTAINER=$(docker run -p 127.0.0.1:${CLIENT_PORT}:8000 -d sadeghhayeri/green-tunnel:${GITHUB_RUN_ID})
          sleep 5
          echo "DOCKERCONTAINER=${DOCKERCONTAINER}" >> $GITHUB_ENV

      - name: Check container is running
        run: docker ps -f id=${DOCKERCONTAINER}

      - name: Check HTTPS (CONNECT + ClientHello fragmentation)
        run: curl -fIs --proxy http://127.0.0.1:${CLIENT_PORT} https://example.com | grep "200"

      - name: Check plain HTTP (absolute-form rewrite)
        run: curl -fIs --proxy http://127.0.0.1:${CLIENT_PORT} http://example.com | grep "200"

      - name: Container logs
        if: always()
        run: docker logs ${DOCKERCONTAINER}

      - name: Stop and remove container
        if: always()
        run: docker stop ${DOCKERCONTAINER} && docker rm -fv ${DOCKERCONTAINER}
